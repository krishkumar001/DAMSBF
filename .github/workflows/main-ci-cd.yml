name: DAMS Complete CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
  FRONTEND_BUILD_DIR: 'dist'
  BACKEND_DIR: 'backend'
  AI_DIR: 'ai'

jobs:
  # ========================================
  # CODE QUALITY & LINTING
  # ========================================
  
  lint-frontend:
    runs-on: ubuntu-latest
    name: Frontend Linting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: |
          npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,md}"
          npx prettier --check "public/**/*.{html,css,js}"

  lint-backend:
    runs-on: ubuntu-latest
    name: Backend Linting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Install backend dependencies
        working-directory: ./${{ env.BACKEND_DIR }}
        run: npm ci

      - name: Run ESLint
        working-directory: ./${{ env.BACKEND_DIR }}
        run: npm run lint

      - name: Check code formatting
        working-directory: ./${{ env.BACKEND_DIR }}
        run: |
          npx prettier --check "**/*.{js,json,md}"
          npx prettier --check "routes/**/*.js"
          npx prettier --check "bal/**/*.js"
          npx prettier --check "dal/**/*.js"

  lint-ai:
    runs-on: ubuntu-latest
    name: AI Model Linting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        working-directory: ./${{ env.AI_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort

      - name: Run flake8
        working-directory: ./${{ env.AI_DIR }}
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Check code formatting with black
        working-directory: ./${{ env.AI_DIR }}
        run: |
          black --check --diff .

      - name: Check import sorting with isort
        working-directory: ./${{ env.AI_DIR }}
        run: |
          isort --check-only --diff .

  # ========================================
  # TESTING
  # ========================================

  test-frontend:
    runs-on: ubuntu-latest
    name: Frontend Testing
    needs: [lint-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_BUILD_DIR }}/
          retention-days: 7

  test-backend:
    runs-on: ubuntu-latest
    name: Backend Testing
    needs: [lint-backend]
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Install backend dependencies
        working-directory: ./${{ env.BACKEND_DIR }}
        run: npm ci

      - name: Run tests
        working-directory: ./${{ env.BACKEND_DIR }}
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/dams-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-cd-pipeline
          PORT: 5001
        run: |
          npm test -- --coverage --watchAll=false
          npm run test:coverage

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./${{ env.BACKEND_DIR }}/coverage/lcov.info
          flags: backend
          name: backend-coverage

  test-ai:
    runs-on: ubuntu-latest
    name: AI Model Testing
    needs: [lint-ai]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        working-directory: ./${{ env.AI_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run tests with coverage
        working-directory: ./${{ env.AI_DIR }}
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./${{ env.AI_DIR }}/coverage.xml
          flags: ai-model
          name: ai-coverage

  # ========================================
  # SECURITY SCANNING
  # ========================================

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scanning
    needs: [test-frontend, test-backend, test-ai]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install audit dependencies
        run: |
          npm install -g npm-audit-resolver
          npm audit --audit-level=moderate

      - name: Run backend security audit
        working-directory: ./${{ env.BACKEND_DIR }}
        run: npm audit --audit-level=moderate

      - name: Run safety check for Python
        working-directory: ./${{ env.AI_DIR }}
        run: |
          pip install safety
          safety check

  # ========================================
  # BUILD & PACKAGE
  # ========================================

  build-frontend:
    runs-on: ubuntu-latest
    name: Build Frontend
    needs: [security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: ${{ env.FRONTEND_BUILD_DIR }}/
          retention-days: 30

  build-backend:
    runs-on: ubuntu-latest
    name: Build Backend
    needs: [security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Install backend dependencies
        working-directory: ./${{ env.BACKEND_DIR }}
        run: npm ci --only=production

      - name: Create backend package
        working-directory: ./${{ env.BACKEND_DIR }}
        run: |
          tar -czf backend-production.tar.gz \
            --exclude=node_modules \
            --exclude=coverage \
            --exclude=*.log \
            --exclude=.env* \
            .

      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-package
          path: ${{ env.BACKEND_DIR }}/backend-production.tar.gz
          retention-days: 30

  # ========================================
  # DEPLOYMENT
  # ========================================

  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-production-build
          path: ./frontend-build

      - name: Deploy frontend to staging
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend-build
          destination_dir: staging
          force_orphan: true

      - name: Deploy backend to staging
        uses: bervProject/railway-deploy@v1.0.0
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          service: dams-backend-staging
          directory: ${{ env.BACKEND_DIR }}

      - name: Run smoke tests
        run: |
          echo "Running smoke tests for staging deployment..."
          # Add your smoke test commands here
          curl -f ${{ secrets.STAGING_FRONTEND_URL }}/health || exit 1
          curl -f ${{ secrets.STAGING_BACKEND_URL }}/health || exit 1

  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-production-build
          path: ./frontend-build

      - name: Deploy frontend to production
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend-build
          force_orphan: true

      - name: Deploy backend to production
        uses: bervProject/railway-deploy@v1.0.0
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          service: dams-backend-production
          directory: ${{ env.BACKEND_DIR }}

      - name: Run production smoke tests
        run: |
          echo "Running smoke tests for production deployment..."
          # Add your production smoke test commands here
          curl -f ${{ secrets.PRODUCTION_FRONTEND_URL }}/health || exit 1
          curl -f ${{ secrets.PRODUCTION_BACKEND_URL }}/health || exit 1

  # ========================================
  # NOTIFICATIONS & MONITORING
  # ========================================

  notify-success:
    runs-on: ubuntu-latest
    name: Notify Success
    needs: [deploy-staging, deploy-production]
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Notify Slack Success
        if: secrets.SLACK_WEBHOOK_URL
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "🎉 DAMS deployment successful!",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Environment", "value": "${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}", "short": true},
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Author", "value": "${{ github.actor }}", "short": true}
                ]
              }]
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-failure:
    runs-on: ubuntu-latest
    name: Notify Failure
    if: failure()
    steps:
      - name: Notify Slack Failure
        if: secrets.SLACK_WEBHOOK_URL
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "❌ DAMS deployment failed!",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Author", "value": "${{ github.actor }}", "short": true},
                  {"title": "Workflow", "value": "${{ github.workflow }}", "short": true}
                ]
              }]
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create issue on failure
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deployment Failed - ${context.sha.substring(0, 7)}`,
              body: `## Deployment Failure

              **Branch:** ${context.ref}
              **Commit:** ${context.sha}
              **Author:** ${context.actor}
              **Workflow:** ${context.workflow}

              Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.

              ### Next Steps:
              1. Review the logs
              2. Fix the issue
              3. Re-run the deployment
              `,
              labels: ['bug', 'deployment-failure']
            }) 